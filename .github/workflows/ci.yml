name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --extra dev
      - run: uv run ruff check . --fix
      - run: uv run ruff format .
      - run: uv run pyright
      - run: uv run pytest
