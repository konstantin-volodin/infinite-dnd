[project]
name = "infinite-dnd"
version = "0.0.1"
authors = [{ name = "Konstantin Volodin" }]
requires-python = "==3.13.12"
license = { text = "MIT" }

dependencies = [
    "jinja2==3.1.6",
    "pydantic==2.12.5",
    "pydantic-ai==1.77.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.350",
    "pre-commit>=3.6.0",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.scripts]
infinite-dnd = "run_game:main"
infinite-dnd-state = "src.interface.app:main"
infinite-dnd-scorecard = "src.interface.scorecard:main"
infinite-dnd-recap = "src.interface.recap:main"
infinite-dnd-dump-context = "src.tests:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live LLM provider (local server or ANTHROPIC_API_KEY); skipped by default",
]
addopts = "-m 'not integration' --import-mode=importlib"
